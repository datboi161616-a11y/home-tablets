<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ECEEF0">
<title>Add photos to the tablet</title>
<style>
  :root { --ink:#1D2430; --ink2:#4A5363; --bg:#ECEEF0; --card:#fff; --accent:#C2491F; --line:#D9DDE2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 18px 60px; }
  h1 { font-size:28px; margin:8px 0 4px; }
  .sub { color:var(--ink2); margin:0 0 20px; }
  .card { background:var(--card); border-radius:20px; padding:20px; margin-bottom:16px; }
  label { display:block; font-weight:600; font-size:15px; margin:0 0 6px; }
  input[type=text] { width:100%; font:inherit; padding:14px; border:1px solid var(--line); border-radius:12px; margin-bottom:14px; background:#fff; }
  .pick { display:flex; align-items:center; justify-content:center; width:100%; min-height:64px; border-radius:16px; background:var(--accent); color:#fff; font-weight:700; font-size:19px; border:0; cursor:pointer; }
  .pick input { display:none; }
  .status { margin-top:14px; color:var(--ink2); min-height:24px; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:10px; display:none; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .ok { color:#2F6B4F; font-weight:600; }
  .err { color:#B3261E; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .ph { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:#C9CFD6; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph button { position:absolute; top:6px; right:6px; width:36px; height:36px; border-radius:18px; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:18px; cursor:pointer; }
  .muted { color:var(--ink2); font-size:15px; }
  h2 { font-size:18px; margin:0 0 12px; display:flex; justify-content:space-between; align-items:baseline; }
</style>
</head>
<body>
<main>
  <h1>Add photos to the tablet</h1>
  <p class="sub">They go straight to this tablet over your Wi-Fi. Nothing is uploaded to the internet.</p>

  <div class="card">
    <label for="name">Your name</label>
    <input id="name" type="text" maxlength="40" placeholder="e.g. Grandma" autocomplete="given-name">
    <label for="caption">Caption <span class="muted">(optional, for this batch)</span></label>
    <input id="caption" type="text" maxlength="120" placeholder="e.g. Thanksgiving 2026">
    <label class="pick">
      Choose photos
      <input id="files" type="file" accept="image/*" multiple>
    </label>
    <div class="bar" id="bar"><div></div></div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h2><span>On the tablet</span><span class="muted" id="count"></span></h2>
    <div class="grid" id="grid"></div>
    <p class="muted" id="empty">No photos yet.</p>
  </div>
</main>

<script>
(function () {
  var key = new URLSearchParams(location.search).get('k') || '';
  var q = function (extra) { return '?k=' + encodeURIComponent(key) + (extra || ''); };
  var $ = function (id) { return document.getElementById(id); };
  var nameEl = $('name'), captionEl = $('caption'), statusEl = $('status'), bar = $('bar');

  nameEl.value = localStorage.getItem('tablet-photo-name') || '';
  nameEl.addEventListener('change', function () { localStorage.setItem('tablet-photo-name', nameEl.value.trim()); });

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }

  // Shrink to at most 2048px on the long side; most phones' photos are 4000px+.
  function resize(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 2048, w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('Could not read photo')); }, 'image/jpeg', 0.86);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error(file.name + ': this phone can’t open that photo format'));
      };
      img.src = url;
    });
  }

  $('files').addEventListener('change', async function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    var name = nameEl.value.trim(), caption = captionEl.value.trim();
    localStorage.setItem('tablet-photo-name', name);
    bar.style.display = 'block';
    var done = 0, failed = [];
    for (var i = 0; i < files.length; i++) {
      setStatus('Sending ' + (i + 1) + ' of ' + files.length + '…');
      try {
        var blob = await resize(files[i]);
        var res = await fetch('/api/upload' + q('&name=' + encodeURIComponent(name) + '&caption=' + encodeURIComponent(caption)), {
          method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' }
        });
        var data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Upload failed');
        done++;
      } catch (err) {
        failed.push(err.message);
      }
      bar.firstElementChild.style.width = Math.round(((i + 1) / files.length) * 100) + '%';
    }
    setTimeout(function () { bar.style.display = 'none'; bar.firstElementChild.style.width = '0'; }, 800);
    if (failed.length) setStatus(done + ' sent. ' + failed.length + ' didn’t: ' + failed[0], 'err');
    else setStatus(done === 1 ? 'Sent! It’s on the tablet now.' : 'All ' + done + ' sent! They’re on the tablet now.', 'ok');
    loadList();
  });

  async function loadList() {
    try {
      var data = await (await fetch('/api/photos' + q())).json();
      var grid = $('grid');
      grid.innerHTML = '';
      $('empty').style.display = data.photos.length ? 'none' : 'block';
      $('count').textContent = data.photos.length + ' of ' + data.max;
      data.photos.forEach(function (p) {
        var d = document.createElement('div');
        d.className = 'ph';
        var img;
        if (p.video) {
          // Don't download whole clips just for a thumbnail.
          img = document.createElement('div');
          img.textContent = '▶ Video';
          img.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1D2430;color:#fff;font-weight:600';
        } else {
          img = document.createElement('img');
          img.loading = 'lazy';
          img.src = '/api/photo/' + p.id + q();
          img.alt = p.caption || 'Photo';
        }
        var del = document.createElement('button');
        del.textContent = '×';
        del.setAttribute('aria-label', 'Remove');
        del.onclick = async function () {
          if (!confirm(p.video ? 'Remove this video from the tablet?' : 'Remove this photo from the tablet?')) return;
          await fetch('/api/delete' + q('&id=' + p.id), { method: 'POST' });
          loadList();
        };
        d.appendChild(img); d.appendChild(del);
        grid.appendChild(d);
      });
    } catch (err) {
      setStatus('Can’t reach the tablet. Is your phone on the same Wi-Fi?', 'err');
    }
  }
  loadList();
})();
</script>
</body>
</html>
