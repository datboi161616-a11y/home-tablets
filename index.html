<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#ECEEF0">
<!-- Only this site's own script files may run here, whatever text arrives from outside
     (a calendar invitation, a note from a phone, the name of a plane). The screens make
     such text safe themselves as well; this is the second lock, for the day one of them
     forgets. Styles, pictures and data may still come from the services the screens use. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src * data: blob:; media-src * data: blob:; connect-src * data: blob:; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
<title>Home screen</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- "crossorigin" lets sw.js keep a copy of this, so the fonts are still there when the Wi-Fi is down. -->
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;700&family=Inter:wght@400;500;600&family=Fraunces:ital,wght@1,400;1,600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
  <!-- Everything is designed on a fixed 1280x800 canvas and scaled to the screen.
       The TB-X606F is 1920x1200, so it renders at exactly 1.5x. -->
  <div id="stage"><div id="screen"></div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
