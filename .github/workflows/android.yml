# Builds the Android launcher app, tests it on an emulator, and (when the
# signing key is configured) publishes it as a GitHub Release. Tablets check
# for new releases every 6 hours and update themselves.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secret set; building a test-only APK (will not be released)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk home-tablets.apk
          ls -la home-tablets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: home-tablets.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Android 10, tablet-sized screen: closest stock match to the TB-X606F.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r home-tablets.apk
            adb shell dpm set-device-owner com.hometablets.launcher/.AdminReceiver
            adb shell am start -n com.hometablets.launcher/.MainActivity --es profile family
            sleep 40
            adb exec-out screencap -p > shot-family.png
            adb shell am start -n com.hometablets.launcher/.MainActivity --es profile tom
            sleep 30
            adb exec-out screencap -p > shot-tom.png
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell dumpsys activity activities | grep -E "mResumedActivity|ResumedActivity" | head -3
            adb shell dumpsys activity activities | grep -q "com.hometablets.launcher/.MainActivity"
            adb shell pidof com.hometablets.launcher
            adb logcat -d -s HomeTablet:* AndroidRuntime:E chromium:* | tail -60 > logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: |
            shot-*.png
            logcat.txt

  release:
    needs: [build, emulator-test]
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "app-${{ github.run_number }}" home-tablets.apk \
            --repo "${{ github.repository }}" \
            --title "Launcher app 1.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Tablets install this automatically within 6 hours."
