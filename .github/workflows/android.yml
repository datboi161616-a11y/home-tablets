# Builds the Android launcher app, tests it on an emulator, and (when the
# signing key is configured) publishes it as a GitHub Release. Tablets check
# for new releases every 6 hours and update themselves.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '!android/**/*.md', 'admin/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secret set; building a test-only APK (will not be released)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk home-tablets.apk
          ls -la home-tablets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: home-tablets.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30   # an emulator that never boots shouldn't run for hours
    # Android 10's original web engine (Chrome 74) crashes in the emulator's software
    # graphics now and then; real tablets have real GPUs. Report it, don't block releases.
    continue-on-error: ${{ matrix.api == 29 }}
    strategy:
      fail-fast: false
      matrix:
        # 29 = Android 10 with its original old WebView (worst case for the tablets)
        # 34 = modern WebView (what an updated tablet has)
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A local copy of the admin hub, so the test can drive remote admin end to end.
      - name: Start local admin hub
        run: |
          cd admin
          npm ci --no-audit --no-fund
          echo "ADMIN_PASSWORD=ci-test-password" > .dev.vars
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > ../wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ >/dev/null && echo "hub up" && exit 0; sleep 2; done
          cat ../wrangler.log; exit 1

      - name: Wait for this commit's web app to be live
        run: |
          for i in $(seq 1 24); do
            v=$(curl -s "https://${{ github.repository_owner }}.github.io/home-tablets/version.json?$i" || true)
            echo "$v"
            echo "$v" | grep -q "${GITHUB_SHA::7}" && exit 0
            sleep 10
          done
          echo "::notice::Site not redeployed for this commit (Android-only change?); testing the current site."

      - name: Write test script
        run: |
          cat > test.sh <<'EOF'
          set -e
          # Always keep the tablet's log, even when a step fails.
          trap 'adb logcat -d > logcat-full.txt 2>/dev/null; grep -E "chromium|HomeTablet|AndroidRuntime|FATAL|DEBUG|libc|ActivityManager: (Process|Killing|Start proc).*hometablets" logcat-full.txt | tail -400 > logcat.txt' EXIT
          adb install -r home-tablets.apk
          adb shell dpm set-device-owner com.hometablets.launcher/.AdminReceiver
          # Same one-time USB step as android/SETUP.md: their-screen picture shows any app
          adb shell appops set com.hometablets.launcher PROJECT_MEDIA allow
          adb logcat -c
          adb reverse tcp:8787 tcp:8787
          adb shell am start -n com.hometablets.launcher/.MainActivity --es profile family --es uploadKey ci-test-key --es hub ws://127.0.0.1:8787/ws/device
          sleep 45
          adb exec-out screencap -p > shot-family.png

          # --- Photo upload, the way a phone does it (raw image body + key) ---
          # Home brings our app to the front (it's the home screen), then wait for its server.
          adb shell input keyevent KEYCODE_HOME
          adb forward tcp:8080 tcp:8080
          for i in $(seq 1 30); do
            curl -s -o /dev/null "http://127.0.0.1:8080/?k=x" && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080/?k=wrong-key")
          echo "wrong key -> $code"; [ "$code" = "403" ]
          curl -sf "http://127.0.0.1:8080/?k=ci-test-key" | grep -q "Add photos to the tablet"
          curl -sf -X POST --data-binary @shot-family.png -H "Content-Type: image/png" \
            "http://127.0.0.1:8080/api/upload?k=ci-test-key&name=CI%20robot&caption=Emulator%20test" | tee upload.json
          grep -q '"ok":true' upload.json
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST --data-binary "not a photo" "http://127.0.0.1:8080/api/upload?k=ci-test-key")
          echo "non-photo -> $code"; [ "$code" = "400" ]
          curl -sf "http://127.0.0.1:8080/api/photos?k=ci-test-key" | tee photos.json
          grep -q '"name":"CI robot"' photos.json
          adb shell am start -n com.hometablets.launcher/.MainActivity --es screen photos
          sleep 15
          adb exec-out screencap -p > shot-photos.png
          adb shell am start -n com.hometablets.launcher/.MainActivity --es screen addphotos
          sleep 10
          adb exec-out screencap -p > shot-addphotos.png

          # --- Camera: open it on their screen and take a photo remotely (via the hub) ---
          adb shell am start -n com.hometablets.launcher/.MainActivity --es screen camera
          sleep 6
          adb exec-out screencap -p > shot-camera.png
          adb shell am start -n com.hometablets.launcher/.MainActivity --es profile tom
          sleep 35
          adb exec-out screencap -p > shot-tom.png
          adb shell input keyevent KEYCODE_HOME
          sleep 3
          adb exec-out screencap -p > shot-after-home.png

          # --- Remote admin, end to end: approve, watch, control the hidden copy, commands ---
          adb shell am start -n com.hometablets.launcher/.MainActivity --es profile family
          node admin/test/e2e.mjs http://127.0.0.1:8787 ci-test-password .
          adb exec-out screencap -p > shot-after-remote.png
          adb logcat -d > logcat-full.txt
          grep -E "chromium|HomeTablet|AndroidRuntime" logcat-full.txt | tail -80 > logcat.txt || true
          adb shell dumpsys package com.google.android.webview | grep -m1 versionName > webview-version.txt || true
          cat webview-version.txt
          # The app must still be in front after pressing Home (kiosk / launcher).
          adb shell dumpsys activity activities | grep -E "ResumedActivity" | grep -q "com.hometablets.launcher"
          # No JavaScript errors and no app crash.
          if grep -E "Uncaught|FATAL EXCEPTION" logcat-full.txt; then echo "JavaScript error or crash"; exit 1; fi
          EOF
          chmod +x test.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Android 10, tablet-sized screen: closest stock match to the TB-X606F.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: ./test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: |
            shot-*.png
            logcat.txt
            webview-version.txt
            upload.json
            photos.json
            remote-*
            wrangler.log
            logcat-full.txt

  release:
    needs: [build, emulator-test]
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "app-${{ github.run_number }}" home-tablets.apk \
            --repo "${{ github.repository }}" \
            --title "Launcher app 1.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Tablets install this automatically within 6 hours."
