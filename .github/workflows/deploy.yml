# Publishes the site to GitHub Pages on every push to main.
# Each deploy stamps version.json with the commit, so every tablet notices
# the new version within 30 minutes and reloads itself.
name: Deploy to tablets

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'admin/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          echo "{ \"version\": \"${GITHUB_SHA::7}\", \"deployed\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" }" > version.json
          cat version.json
          # The same id goes into the code, so a tablet can tell which version it is really
          # running (see js/build.js and "Picking up a published update" in js/app.js).
          echo "export const BUILD = '${GITHUB_SHA::7}';" > js/build.js
          cat js/build.js

      # The tablets' built-in WebView can be old (Chrome 7x). Translate the
      # JavaScript to syntax it understands; the source stays modern.
      - name: Build site for older tablets
        run: |
          mkdir _site
          cp -r index.html css data version.json remote.json .nojekyll _site/
          npx -y esbuild@0.24.2 $(find js -name '*.js') sw.js \
            --outdir=_site --outbase=. --target=chrome64 --log-level=warning
          if grep -rlE '\?\.[a-zA-Z_$(\[]|\?\?' _site/js _site/sw.js; then
            echo "::error::Modern syntax left after translation"; exit 1
          fi
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
