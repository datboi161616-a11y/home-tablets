# Publishes the site to GitHub Pages on every push to main.
# Each deploy stamps version.json with the commit, so every tablet notices
# the new version within 30 minutes and reloads itself.
name: Deploy to tablets

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'admin/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # (The browser test below talks to the browser with Node's own WebSocket: Node 22.)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp version
        run: |
          echo "{ \"version\": \"${GITHUB_SHA::7}\", \"deployed\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" }" > version.json
          cat version.json
          # The same id goes into the code, so a tablet can tell which version it is really
          # running (see js/build.js and "Picking up a published update" in js/app.js).
          echo "export const BUILD = '${GITHUB_SHA::7}';" > js/build.js
          cat js/build.js

      # Nothing reaches the kitchens that the checks would have caught: an import that
      # doesn't exist, or something the tablets' old browser engine doesn't have.
      - name: Check before publishing
        run: bash tools/check.sh

      # The tablets' built-in WebView can be old (Chrome 7x). Translate the
      # JavaScript to syntax it understands; the source stays modern.
      - name: Build site for older tablets
        run: |
          mkdir _site
          cp -r index.html css data guide version.json remote.json .nojekyll _site/
          npx -y esbuild@0.24.2 $(find js -name '*.js') sw.js \
            --outdir=_site --outbase=. --target=chrome64 --log-level=warning
          if grep -rlE '\?\.[a-zA-Z_$(\[]|\?\?' _site/js _site/sw.js; then
            echo "::error::Modern syntax left after translation"; exit 1
          fi
          find _site -type f | sort

      # The built site, exactly as the tablets will fetch it, opened in a real browser:
      # every screen, as a kitchen screen and as Tom's deck, with no internet behind it.
      # A screen that can't open, an error nobody catches, or "undefined" on screen stops
      # the publish here; the tablets simply keep the version they have.
      - name: Open every screen of the built site
        timeout-minutes: 8
        run: |
          python3 tools/sim/serve.py 5173 _site > /dev/null 2>&1 &
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "Browser: $BROWSER"; "$BROWSER" --version
          BROWSER="$BROWSER" node tools/sim/smoke.mjs

      # The same again in the tablets' own engine: Chromium 81, the build Google keeps for
      # exactly this kind of testing. It is years of web behind the browser above, so it
      # catches what only an old engine trips over. A screen that fails HERE stops the
      # publish like any other. Only if that old build can't be fetched or won't start one
      # day does the publish go ahead without it, with a warning on the run.
      - name: The same, in the tablets' own engine (Chromium 81)
        timeout-minutes: 8
        run: |
          if ! curl -sSfL -o chromium81.zip "https://commondatastorage.googleapis.com/chromium-browser-snapshots/Linux_x64/737027/chrome-linux.zip" \
             || ! unzip -q chromium81.zip -d chromium81 || ! chromium81/chrome-linux/chrome --version; then
            echo "::warning::Chromium 81 couldn't be fetched or started, so the site was NOT tested in the tablets' own engine this time."
            exit 0
          fi
          rc=0
          BROWSER="$PWD/chromium81/chrome-linux/chrome" HEADLESS_FLAG="--headless" node tools/sim/smoke.mjs || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::warning::Chromium 81 didn't start, so the site was NOT tested in the tablets' own engine this time."
            exit 0
          fi
          exit $rc

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
